[package]
name = "HEMA-training-tool"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = { version = "0.18.0", features = ["jpeg", "png"] }
bevy_ui_widgets = "0.18.0"
once_cell = "1.21.4"
rand = "0.9.2"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3
